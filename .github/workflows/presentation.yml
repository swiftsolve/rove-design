name: Presentation

# Export the Figma file as the slideshow and publish it to GitHub Pages
# (https://swiftsolve.github.io/rove-design/) on every release tag, so the page
# always shows the latest release. Run it by hand to pick up Figma edits
# between releases.
#
# Needs the FIGMA_TOKEN repository secret: a Figma personal access token with
# file_content:read.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# A newer run replaces an older one; each publish replaces the page anyway.
concurrency:
  group: presentation
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Figma token
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          [ -n "$FIGMA_TOKEN" ] || { echo "::error::Add a FIGMA_TOKEN repository secret (Figma personal access token, file_content:read)"; exit 1; }

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Export from Figma
        run: npm run present
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}

      # publish.mjs pushes from a fresh repo in a temp folder, so it needs a
      # git identity and the token in the remote URL rather than checkout's
      # per-repo credentials.
      - name: Publish to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf https://github.com/
          npm run present:publish

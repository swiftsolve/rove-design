<style>
  /* Figma's theme colours (showUI themeColors), with UI3 light values for a plain browser. */
  :root {
    --bg: var(--figma-color-bg, #fff);
    --bg-secondary: var(--figma-color-bg-secondary, #f5f5f5);
    --bg-hover: var(--figma-color-bg-hover, #f5f5f5);
    --bg-brand: var(--figma-color-bg-brand, #0d99ff);
    --bg-brand-hover: var(--figma-color-bg-brand-hover, #007be5);
    --text: var(--figma-color-text, #000000e5);
    --text-secondary: var(--figma-color-text-secondary, #00000080);
    --text-tertiary: var(--figma-color-text-tertiary, #0000004d);
    --text-onbrand: var(--figma-color-text-onbrand, #fff);
    --text-danger: var(--figma-color-text-danger, #dc3412);
    --text-success: var(--figma-color-text-success, #14ae5c);
    --border: var(--figma-color-border, #e6e6e6);
    --syntax-key: #7c3aed;
    --syntax-string: #0f7b4f;
    --syntax-number: #c2410c;
    --syntax-literal: #0369a1;
  }
  .figma-dark {
    --syntax-key: #c4a5ff;
    --syntax-string: #7dd3a8;
    --syntax-number: #fdba74;
    --syntax-literal: #7cc4f8;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 11px/16px Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: default; }

  header { padding: 14px 16px 12px; }
  h1 { margin: 0; font-size: 13px; line-height: 20px; font-weight: 600; letter-spacing: -0.005em; }
  .meta { margin-top: 2px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .meta b { color: var(--text); font-weight: 500; }

  nav { display: flex; gap: 2px; margin: 0 12px; padding: 2px; border-radius: 6px; background: var(--bg-secondary); }
  nav button {
    flex: 1; height: 24px; border: 0; border-radius: 5px; background: none;
    color: var(--text-secondary); font-weight: 500;
  }
  nav button:hover { color: var(--text); }
  nav button[aria-selected='true'] { background: var(--bg); color: var(--text); box-shadow: 0 0 0 0.5px var(--border), 0 1px 2px #0000001a; }
  nav .count { margin-left: 4px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

  main { flex: 1; min-height: 0; margin: 10px 12px 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  pre {
    margin: 0; height: 100%; overflow: auto; padding: 8px 0;
    font: 11px/17px 'SF Mono', ui-monospace, Menlo, Consolas, monospace; tab-size: 2;
    counter-reset: line;
  }
  pre span.line { display: block; padding-right: 12px; }
  pre span.line::before {
    counter-increment: line; content: counter(line);
    display: inline-block; width: 36px; margin-right: 12px; padding-right: 8px; text-align: right;
    color: var(--text-tertiary); user-select: none;
  }
  .k { color: var(--syntax-key); }
  .s { color: var(--syntax-string); }
  .n { color: var(--syntax-number); }
  .l { color: var(--syntax-literal); }

  .state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; color: var(--text-secondary); }
  .state.error { color: var(--text-danger); }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--bg-brand); animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }

  footer { display: flex; align-items: center; gap: 8px; padding: 12px; }
  .hint { flex: 1; min-width: 0; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint code { font: 11px 'SF Mono', ui-monospace, Menlo, Consolas, monospace; color: var(--text); }
  .btn { height: 24px; padding: 0 10px; border-radius: 5px; font-weight: 500; white-space: nowrap; }
  .btn:disabled { opacity: 0.4; }
  .secondary { border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .secondary:hover:not(:disabled) { background: var(--bg-hover); }
  .secondary.done { color: var(--text-success); }
  .primary { border: 0; background: var(--bg-brand); color: var(--text-onbrand); }
  .primary:hover:not(:disabled) { background: var(--bg-brand-hover); }

  #clipboard { position: fixed; left: -9999px; }
</style>

<header>
  <h1 id="title">Rove tokens export</h1>
  <div class="meta" id="meta">Reading the file…</div>
</header>
<nav role="tablist">
  <button role="tab" data-file="variables.json" aria-selected="true">Variables<span class="count" id="count-variables.json"></span></button>
  <button role="tab" data-file="text-styles.json" aria-selected="false">Text styles<span class="count" id="count-text-styles.json"></span></button>
</nav>
<main id="view"><div class="state"><div class="spinner"></div>Reading variables and text styles…</div></main>
<footer>
  <span class="hint">Save to <code>src/figma/</code></span>
  <button class="btn secondary" id="copy" disabled>Copy</button>
  <button class="btn secondary" id="download" disabled>Download</button>
  <button class="btn primary" id="download-both" disabled>Download both</button>
</footer>
<textarea id="clipboard" aria-hidden="true"></textarea>

<script>
  const $ = (id) => document.getElementById(id)
  let files = null
  let current = 'variables.json'

  const escape = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])
  const TOKEN = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g
  const highlight = (line) =>
    escape(line).replace(TOKEN, (match, string, colon, literal) =>
      string ? (colon ? `<span class="k">${string}</span>${colon}` : `<span class="s">${string}</span>`)
      : literal ? `<span class="l">${match}</span>`
      : `<span class="n">${match}</span>`)

  function show() {
    for (const tab of document.querySelectorAll('[role=tab]')) tab.setAttribute('aria-selected', tab.dataset.file === current)
    if (!files) return
    $('view').innerHTML = `<pre>${files[current].split('\n').map((l) => `<span class="line">${highlight(l)}</span>`).join('')}</pre>`
  }

  onmessage = (event) => {
    const message = event.data.pluginMessage
    if (message.error) {
      $('meta').textContent = 'Export failed'
      $('view').innerHTML = `<div class="state error">${escape(message.error)}</div>`
      return
    }
    files = message
    const variables = JSON.parse(files['variables.json'])
    const styles = JSON.parse(files['text-styles.json'])
    const fileName = variables.source.match(/\((.*)\)$/)?.[1]
    if (fileName) $('title').textContent = fileName
    $('meta').innerHTML = `<b>${variables.collections.length}</b> collections · <b>${variables.variables.length}</b> variables · <b>${styles.styles.length}</b> text styles`
    $('count-variables.json').textContent = variables.variables.length
    $('count-text-styles.json').textContent = styles.styles.length
    $('copy').disabled = $('download').disabled = $('download-both').disabled = false
    show()
  }

  for (const tab of document.querySelectorAll('[role=tab]')) tab.onclick = () => { current = tab.dataset.file; show() }

  $('copy').onclick = () => {
    // The plugin iframe has no Clipboard API, so copy through a hidden textarea.
    $('clipboard').value = files[current]
    $('clipboard').select()
    document.execCommand('copy')
    $('copy').textContent = 'Copied'
    $('copy').classList.add('done')
    setTimeout(() => { $('copy').textContent = 'Copy'; $('copy').classList.remove('done') }, 1400)
  }

  const download = (name) => {
    const link = document.createElement('a')
    link.href = URL.createObjectURL(new Blob([files[name] + '\n'], { type: 'application/json' }))
    link.download = name
    link.click()
  }

  $('download').onclick = () => download(current)
  // A short gap, or the browser may drop the second download.
  $('download-both').onclick = () => {
    download('variables.json')
    setTimeout(() => download('text-styles.json'), 300)
  }
</script>
